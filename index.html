<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marco Vital | Mechanical Engineering</title>
  <script>
    // README.md contains the portfolio HTML. Fetch it and replace this
    // bootstrap page so the README source is never displayed as text.
    fetch('https://raw.githubusercontent.com/marcojvital/Portfolio/main/README.md')
      .then(response => {
        if (!response.ok) throw new Error('Unable to load portfolio');
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.body.innerHTML = '<p style="font-family: sans-serif; padding: 2rem">The portfolio could not be loaded. Please refresh the page.</p>';
      });
  </script>
</head>
<body>
  <p style="font-family: sans-serif; padding: 2rem">Loading portfolio…</p>
</body>
</html>
